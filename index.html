      <div class="cap" data-w="0.06,0.26"><h2>Из<br>хаоса</h2><p>Сначала — рассеянная пыль. Дальше она собирается в смысл.</p></div>
      <div class="cap" data-w="0.38,0.60"><h2>Система<br>смыслов</h2><p>Он расходится в целую вселенную решений.</p></div>
      <div class="cap" data-w="0.74,0.98"><h2>Сделано<br>с сердцем</h2><p>И сходится в одно — то, что делаешь с любовью.</p></div>

const RING={"ucx": 0.5067733234190429, "ucy_tex": 0.4996642623235007, "rux": 0.16914795080101727, "ruy": 0.30070746809069737};                 // {ucx,ucy_tex,rux,ruy} кольца в картинке
const TARGET_R=0.42;                 // радиус кольца = 42% меньшей стороны экрана
const ZOOM_MAX=0.45;                 // сила наезда за прокрутку
(() => {
  function b64F32(b){const s=atob(b),n=s.length,buf=new ArrayBuffer(n),u=new Uint8Array(buf);
    for(let i=0;i<n;i++)u[i]=s.charCodeAt(i);return new Float32Array(buf);}
  const heartPos0=b64F32(HEART_B64), heartCol0=b64F32(HCOL_B64);
  const mobileEarly=innerWidth<720;
  const COUNT=mobileEarly?Math.min(12000,heartPos0.length/3):heartPos0.length/3;

  const canvas=document.getElementById('gl');

  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // ---------- ФОН: затмение, кольцо в центре, зум по скроллу ----------
  const bgScene=new THREE.Scene();
  const bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const tex=new THREE.TextureLoader().load(ECLIPSE);
  tex.minFilter=THREE.LinearFilter; tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  const bgMat=new THREE.ShaderMaterial({
    depthTest:false,depthWrite:false,
    uniforms:{uTex:{value:tex},uTime:{value:0},uZoom:{value:1},
      uCx:{value:RING.ucx},uCy:{value:RING.ucy_tex},uKx:{value:0.3},uKy:{value:0.3}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
    fragmentShader:`
      varying vec2 vUv;uniform sampler2D uTex;uniform float uTime;uniform float uZoom;
      uniform float uCx;uniform float uCy;uniform float uKx;uniform float uKy;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
        float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));

        float plum=dot(texture2D(uTex,uv).rgb,vec3(0.299,0.587,0.114));

        uv+=warp*heat*0.010;
        vec3 col=texture2D(uTex,uv).rgb;
        float lum=dot(col,vec3(0.299,0.587,0.114));
        float glow=smoothstep(0.28,0.85,lum);

        float d=distance(vUv,vec2(0.5));
        col*=1.0-0.4*smoothstep(0.35,0.98,d);
        gl_FragColor=vec4(col,1.0);
      }`

  camera.position.set(0,0,CAMZ);

  const Rr0=2.6, R=2.4, rand=()=>Math.random();
  // форма 0 — рассыпаны ВНУТРИ чёрного круга, чуть выступая за ореол
  function scatter(){const a=rand()*2*Math.PI,rr=Rr0*1.05*Math.sqrt(rand());
    return[Math.cos(a)*rr,Math.sin(a)*rr,(rand()-0.5)*Rr0*0.3];}
  function galaxy(){const arms=4,arm=Math.floor(rand()*arms),t=Math.pow(rand(),0.6);
    const rad=R*(0.12+t*1.2),ang=t*5.5+arm*(2*Math.PI/arms)+(rand()-0.5)*0.6;

    p1[i*3]=b[0];p1[i*3+1]=b[1];p1[i*3+2]=b[2];
    const u=rand(),v=rand(),th=2*Math.PI*u,ph=Math.acos(2*v-1);

    rnd[i]=rand();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(p0,3));
  geo.setAttribute('aPos1',new THREE.BufferAttribute(p1,3));
  geo.setAttribute('aPos2',new THREE.BufferAttribute(heartPos,3));
  geo.setAttribute('aDir',new THREE.BufferAttribute(dir,3));
  geo.setAttribute('aRnd',new THREE.BufferAttribute(rnd,1));
  geo.setAttribute('aHeartCol',new THREE.BufferAttribute(heartCol,1));

  const mat=new THREE.ShaderMaterial({
    transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uProgress:{value:0},uTime:{value:0},uSize:{value:mobile?26:30}},
    vertexShader:`
      attribute vec3 aPos1;attribute vec3 aPos2;attribute vec3 aDir;attribute float aRnd;attribute float aHeartCol;
      uniform float uProgress;uniform float uTime;uniform float uSize;

      void main(){

        float burst=sin(seg*3.14159265);

        pos+=aDir*(sin(uTime*0.7+aRnd*6.28)*0.030 + sin(uTime*0.27+aRnd*10.0)*0.018);
        vP=p*0.5;vHeart=smoothstep(1.25,2.0,p);vHc=aHeartCol;vRnd=aRnd;
        // биение ВОЛНОЙ: удар выходит из центра сердца к краям (задержка фазы по радиусу vHc)
        float per=1.5, tt=fract(uTime/per - aHeartCol*0.5);
        float vb=exp(-pow(tt/0.06,2.0))+0.6*exp(-pow((tt-0.17)/0.06,2.0));

    fragmentShader:`
      varying float vP;varying float vHeart;varying float vHc;varying float vRnd;varying float vBeat;
      void main(){

  function resize(){
    const W=innerWidth,H=innerHeight,minD=Math.min(W,H);
    camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
    // фон: kx,ky чтобы кольцо радиусом TARGET_R*minD легло по центру

    bgMat.uniforms.uKy.value=(H/(TARGET_R*minD))*RING.ruy;

    const hh=Math.tan(FOV/2*Math.PI/180)*CAMZ;      // мировая полу-высота на z=0
    const worldPerPx=2*hh/H;
    const ringWorldR=TARGET_R*minD*worldPerPx;

    // размер сердца, при котором оно помещается в экран (по высоте и ширине)

  const clock=new THREE.Clock();

    bgMat.uniforms.uZoom.value=Z;

    points.scale.setScalar(pScale*(1.0+beat*0.05));

    // вращается ТОЛЬКО собравшаяся галактика (стоишь на ней). пыль и переходы — статичны.
    const ga=Math.max(0,Math.min(1,(curP-0.40)/0.08)), gb=Math.max(0,Math.min(1,(curP-0.52)/0.08));
    const gw=(ga*ga*(3-2*ga))*(1-(gb*gb*(3-2*gb)));   // «полка» на галактике, 0 на пыли/переходах/сердце
    spinPhase+=0.010*gw;                              // копится только на галактике
    points.rotation.z=spinPhase*gw;                   // уходя с галактики — плавно к 0 (фронтально)

    caps.forEach(c=>{const[a,b]=c.w;let o=0;
      if(curP>=a&&curP<=b){const t=(curP-a)/(b-a);o=t<0.2?t/0.2:t>0.8?(1-t)/0.2:1;}
      c.el.style.opacity=Math.max(0,Math.min(1,o));
      c.el.style.transform=`translateY(${(1-Math.max(0,Math.min(1,o)))*16}px)`;});

    renderer.clear();
    renderer.render(bgScene,bgCam);
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
